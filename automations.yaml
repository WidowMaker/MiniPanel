- id: '1709156009036'
  alias: Caroline Hue Dimmer Remote With Hold
  description: ''
  use_blueprint:
    path: lksnyder0/hue-remote-dimmer-january-2022.yaml
    input:
      dimmer_device: 9d63dabade6409eb88c3211d09a8dbc1
      on_short_action:
      - service: light.turn_on
        metadata: {}
        data:
          color_temp: 372
          brightness_pct: 48
          transition: 4
        target:
          area_id: caroline
      off_short_action:
      - service: light.turn_off
        metadata: {}
        data:
          transition: 4
        target:
          area_id: caroline
      brightness_up_short_action:
      - service: light.turn_on
        metadata: {}
        data:
          brightness_step_pct: 10
        target:
          area_id: caroline
      brightness_down_short_action:
      - service: light.turn_on
        metadata: {}
        data:
          brightness_step_pct: -10
        target:
          area_id: caroline
      on_long_action: []
      off_long_action:
      - type: turn_off
        device_id: d6a532a5210b8f81180939e7bf48f6dc
        entity_id: abebec1d68cabdc44122b2eb775d6d55
        domain: light
