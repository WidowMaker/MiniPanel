- id: '1781095732792'
  alias: Badeværelse dæmper styrer pendel
  description: Gang 1 følger Nordtronic dæmperens tænd/sluk og lysstyrke
  triggers:
  - entity_id: light.nordtronic_a_s_rotdimz_98424072
    trigger: state
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: light.nordtronic_a_s_rotdimz_98424072
        state: 'off'
      sequence:
      - target:
          entity_id: light.gang_1
        action: light.turn_off
    - conditions:
      - condition: state
        entity_id: light.nordtronic_a_s_rotdimz_98424072
        state: 'on'
      sequence:
      - target:
          entity_id: light.gang_1
        data:
          brightness: '{{ state_attr(''light.nordtronic_a_s_rotdimz_98424072'', ''brightness'')
            | int(190) }}

            '
        action: light.turn_on
  mode: restart
- id: '1781096659923'
  alias: Begræns Nordtronic dæmper til 75 procent
  description: Sætter Nordtronic dæmper tilbage til max 75 procent hvis den drejes
    højere
  triggers:
  - entity_id: light.nordtronic_a_s_rotdimz_98424072
    attribute: brightness
    trigger: state
  conditions:
  - condition: numeric_state
    entity_id: light.nordtronic_a_s_rotdimz_98424072
    attribute: brightness
    above: 190
  actions:
  - target:
      entity_id: light.nordtronic_a_s_rotdimz_98424072
    data:
      brightness: 190
    action: light.turn_on
  mode: restart
- id: '1781096834345'
  alias: Badeværelse dæmper styrer pendel plus 25 procent
  description: Gang 1 følger Nordtronic dæmperen, men ligger 25 procentpoint højere
  triggers:
  - entity_id: light.nordtronic_a_s_rotdimz_98424072
    trigger: state
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: light.nordtronic_a_s_rotdimz_98424072
        state: 'off'
      sequence:
      - target:
          entity_id: light.gang_1
        action: light.turn_off
    - conditions:
      - condition: state
        entity_id: light.nordtronic_a_s_rotdimz_98424072
        state: 'on'
      sequence:
      - variables:
          dimmer_brightness: '{{ state_attr(''light.nordtronic_a_s_rotdimz_98424072'',
            ''brightness'') | int(0) }}'
          pendel_brightness: '{{ [dimmer_brightness + 64, 254] | min }}'
      - target:
          entity_id: light.gang_1
        data:
          brightness: '{{ pendel_brightness }}'
        action: light.turn_on
  mode: restart
